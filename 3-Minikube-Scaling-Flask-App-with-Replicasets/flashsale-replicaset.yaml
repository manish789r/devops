apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: sale-rs
  labels:
    app: saleapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: saleapp
  template:
    metadata:
      labels:
        app: saleapp
    spec:
      containers:
      - name: saleapp-container
        image: saleapp:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sale-svc
spec:
  selector:
    app: saleapp
  ports:
  - name: http
    port: 80
    targetPort: 5000
  type: NodePort
